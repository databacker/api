openapi: 3.0.0
info:
  title: Databack API
  description: API for communications and administration of databacker instances
  version: "1.0.0"

servers:
  - url: /
    description: download of configuration by databacker instances

security:
  - EngineSignatureInput: []
    EngineSignature: []

paths:
  /engines/config/{instance}:
    get:
      operationId: getConfigInstance
      description: |
        Returns a complete Config document for a specific databacker instance.
        The document may be local, remote, or encrypted. Authentication is
        derived from the verified signature key; the authenticated engine must
        equal the instance path parameter.
      parameters:
        - in: path
          name: instance
          schema:
            type: string
          required: true
          description: Unique ID of the databacker instance whose config should be retrieved
      responses:
        '200':
          description: successfully authenticated and found config for a databacker instance
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Config'
        '404':
          description: databacker instance not found, or unknown to user
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object 
                properties:           
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/EngineUnauthorized'
        '403':
          $ref: '#/components/responses/EngineForbidden'

  /engines/telemetry/{instance}/log:
    get:
      operationId: getTelemetryInstanceLog
      description: get the ability to log to this endpoint, given credentials
      parameters:
        - in: path
          name: instance
          schema:
            type: string
          required: true
          description: Unique ID of the databacker instance for whom this log is generated
      responses:
        '200':
          description: successfully authenticated and can send logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  log:
                    type: string
        '404':
          description: databacker instance not found, or unknown to user
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object 
                properties:           
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/EngineUnauthorized'
        '403':
          $ref: '#/components/responses/EngineForbidden'
    post:
      operationId: postTelemetryInstanceLog
      description: upload logs from a databacker instance
      parameters:
        - in: path
          name: instance
          schema:
            type: string
          required: true
          description: Unique ID of the databacker instance for whom the log is being uploaded
        - $ref: '#/components/parameters/ContentDigest'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/Log'
      responses:
        '201':
          description: successfully posted backup log, will return no data. Reference to the log ID is in the Location header.
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object 
                properties:    
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/EngineUnauthorized'
        '403':
          $ref: '#/components/responses/EngineForbidden'

  /engines/telemetry/{instance}/traces:
    get:
      operationId: getTelemetryInstanceTraces
      description: get the ability to send traces to this endpoint, given credentials
      parameters:
        - in: path
          name: instance
          schema:
            type: string
          required: true
          description: Unique ID of the databacker instance for whom this trace is generated
      responses:
        '200':
          description: successfully authenticated and can send traces
          content:
            application/json:
              schema:
                type: object
                properties:
                  trace:
                    type: string
        '404':
          description: databacker instance not found, or unknown to user
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object 
                properties:           
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/EngineUnauthorized'
        '403':
          $ref: '#/components/responses/EngineForbidden'
    post:
      operationId: postTelemetryInstanceTraces
      description: upload OTLP traces from a databacker instance
      parameters:
        - in: path
          name: instance
          schema:
            type: string
          required: true
          description: Unique ID of the databacker instance for whom the log is being uploaded
        - $ref: '#/components/parameters/ContentDigest'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
              description: "Serialized ExportTraceServiceRequest protobuf message"
      responses:
        '200':
          description: successfully posted backup trace
          content:
            application/x-protobuf:
              schema:
                type: string
                format: binary
                description: "Serialized ExportTraceServiceResponse protobuf message"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object 
                properties:           
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/EngineUnauthorized'
        '403':
          $ref: '#/components/responses/EngineForbidden'
        '429':
          description: "Rate Limited"
          headers:
            Retry-After:
              schema:
                type: string
                description: "Seconds to wait before retrying"                    

components:
  securitySchemes:
    EngineSignatureInput:
      type: apiKey
      in: header
      name: Signature-Input
      description: RFC 9421 signature parameters using the Databacker engine profile.
    EngineSignature:
      type: apiKey
      in: header
      name: Signature
      description: RFC 9421 Ed25519 signature using the Databacker engine profile.
  parameters:
    ContentDigest:
      name: Content-Digest
      in: header
      required: true
      description: RFC 9530 SHA-256 digest of the transmitted request content.
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable UUID reused for retries of the same mutation or ingestion request.
      schema:
        type: string
        format: uuid
  responses:
    EngineUnauthorized:
      description: |
        Authentication failed. The response does not disclose whether a key
        exists, is revoked, belongs to another engine, or produced an invalid
        signature. The Date header supplies server time for clock diagnostics.
      headers:
        Date:
          required: true
          schema:
            type: string
          description: Server time in HTTP-date format.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    EngineForbidden:
      description: Authenticated engine is not authorized because of engine or account state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          maxLength: 256
